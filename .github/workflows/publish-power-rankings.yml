name: Publish Power Rankings

on:
  workflow_dispatch:
    inputs:
      league:
        description: League to build
        required: true
        default: all
        type: choice
        options:
          - all
          - main
          - free
      dry_run:
        description: Preview only (do not post to Discord)
        required: true
        default: true
        type: boolean
      force_post:
        description: Allow a second live post for the same week
        required: true
        default: false
        type: boolean
  schedule:
    # Noon in New York is 16:00 UTC during daylight time and 17:00 UTC
    # during standard time. The application's local-time guard lets only the
    # correct run publish.
    - cron: "0 16 * * 6"
    - cron: "0 17 * * 6"

permissions:
  contents: write

concurrency:
  group: ironbound-weekly-power-rankings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build or publish rankings
        env:
          MAIN_IRONBOUND_WEEKLY_WEBHOOK: ${{ secrets.MAIN_IRONBOUND_WEEKLY_WEBHOOK }}
          FREE_IRONBOUND_WEEKLY_WEBHOOK: ${{ secrets.FREE_IRONBOUND_WEEKLY_WEBHOOK }}
          MAIN_IRONBOUND_WEEKLY_TAG_IDS: ${{ vars.MAIN_IRONBOUND_WEEKLY_TAG_IDS }}
          FREE_IRONBOUND_WEEKLY_TAG_IDS: ${{ vars.FREE_IRONBOUND_WEEKLY_TAG_IDS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m ironbound_rankings --league all --publish --scheduled
          else
            args=(--league "${{ inputs.league }}")
            if [ "${{ inputs.dry_run }}" = "false" ]; then
              args+=(--publish)
            fi
            if [ "${{ inputs.force_post }}" = "true" ]; then
              args+=(--force)
            fi
            python -m ironbound_rankings "${args[@]}"
          fi

      - name: Upload preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-rankings-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            exports/main/latest.png
            exports/main/latest.txt
            exports/main/latest.json
            exports/free/latest.png
            exports/free/latest.txt
            exports/free/latest.json

      - name: Save successful publication state
        if: always() && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          if ! git status --porcelain -- state | grep -q .; then
            echo "No publication state changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add state
          git commit -m "Save weekly power ranking state"
          git push origin HEAD:main
