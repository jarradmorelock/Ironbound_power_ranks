name: Recover Sept 12 Power Rankings

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-saturday-2026-09-12.yml

permissions:
  contents: write

concurrency:
  group: ironbound-weekly-power-rankings
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Publish both leagues
        env:
          MAIN_IRONBOUND_WEEKLY_WEBHOOK: ${{ secrets.MAIN_IRONBOUND_WEEKLY_WEBHOOK }}
          FREE_IRONBOUND_WEEKLY_WEBHOOK: ${{ secrets.FREE_IRONBOUND_WEEKLY_WEBHOOK }}
          MAIN_IRONBOUND_WEEKLY_TAG_IDS: ${{ vars.MAIN_IRONBOUND_WEEKLY_TAG_IDS }}
          FREE_IRONBOUND_WEEKLY_TAG_IDS: ${{ vars.FREE_IRONBOUND_WEEKLY_TAG_IDS }}
        run: python -m ironbound_rankings --league all --publish

      - name: Save publication state
        run: |
          if ! git status --porcelain -- state | grep -q .; then
            echo "No publication state changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add state
          git commit -m "Save recovered Sept 12 power ranking state"
          git push origin HEAD:main
